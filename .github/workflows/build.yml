name: Build Music Sender APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Show repo files
        run: find . -path ./.git -prune -o -type f -print | head -50
      - name: Prepare project
        run: |
          M=$(find . -path ./.git -prune -o -name AndroidManifest.xml -print | head -1)
          echo "Manifest: $M"
          test -n "$M" || { echo "No AndroidManifest.xml in repo - upload the app folder"; exit 1; }
          ROOT=$(dirname "$(dirname "$(dirname "$(dirname "$M")")")")
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          cd "$ROOT"
          [ -f settings.gradle.kts ] || cat > settings.gradle.kts <<'EOT'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
                  maven("https://jitpack.io")
              }
          }
          rootProject.name = "MusicSender"
          include(":app")
          EOT
          mkdir -p gradle
          [ -f gradle/libs.versions.toml ] || cat > gradle/libs.versions.toml <<'EOT'
          [versions]
          agp = "9.0.1"
          dadb = "1.2.10"
          okio = "3.9.1"
          grpc = "1.68.2"
          coroutines = "1.10.1"

          [libraries]
          okio = { group = "com.squareup.okio", name = "okio", version.ref = "okio" }
          dadb = { group = "dev.mobile", name = "dadb", version.ref = "dadb" }
          grpc-okhttp = { group = "io.grpc", name = "grpc-okhttp", version.ref = "grpc" }
          grpc-stub = { group = "io.grpc", name = "grpc-stub", version.ref = "grpc" }
          kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
          kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }

          [plugins]
          android-application = { id = "com.android.application", version.ref = "agp" }
          EOT
          [ -f build.gradle.kts ] || printf 'plugins {\n    alias(libs.plugins.android.application) apply false\n}\n' > build.gradle.kts
          [ -f gradle.properties ] || printf 'org.gradle.jvmargs=-Xmx2048m\nandroid.useAndroidX=true\nandroid.nonTransitiveRClass=true\nandroid.suppressUnsupportedCompileSdk=37.1\n' > gradle.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.4.1
      - name: Build
        run: cd "$ROOT" && gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MusicSender-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
